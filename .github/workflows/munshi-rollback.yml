# Munshi Worker Rollback Workflow
#
# Restores an earlier deployed version of the Munshi Cloudflare Worker in seconds.
# Used as an operational emergency brake when a production release has unexpected bugs.
#
# Important: This action modifies only the active deployment on Cloudflare's edge;
# it does not alter git history. You must follow up with a `git revert` commit on main,
# otherwise the next push to main will redeploy the faulty code.
name: Munshi rollback

# Triggered manually from the GitHub Actions UI during an operational incident.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version ID to restore. Leave empty for the version before the current one.
        required: false
        type: string
      reason:
        description: Why this rollback is needed. Recorded on the deployment.
        required: true
        type: string

# Share concurrency group with the main CI/CD deployment pipeline to prevent race conditions.
# Sequential execution ensures rollbacks and deployments never clobber each other.
concurrency:
  group: CI/CD-refs/heads/main
  cancel-in-progress: false

# Restrict default permissions to read-only access.
permissions:
  contents: read

jobs:
  rollback:
    name: Roll back Worker
    # Ensure rollbacks are only executed in the context of the production main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Disable telemetry prompts during automated CLI executions.
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow clone: git history is not needed for a version rollback.
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Execute rollback via Wrangler CLI.
      # Inputs are passed strictly via environment variables to guard against shell injection.
      # The --yes flag answers interactive confirmation prompts automatically.
      - name: Roll back
        working-directory: worker
        env:
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_ID" ]; then
            npx wrangler rollback "$VERSION_ID" --message "$REASON" --yes
          else
            npx wrangler rollback --message "$REASON" --yes
          fi

      # Output current active deployments to runner logs for immediate operator verification.
      - name: Show current deployment
        working-directory: worker
        run: npx wrangler deployments status
