# Puts an earlier version of the Munshi Worker back in service. Takes effect in seconds and
# changes nothing in the repository: follow it with a revert commit, or the next push to main
# deploys the faulty code again.
name: Munshi rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version ID to restore. Leave empty for the version before the current one.
        required: false
        type: string
      reason:
        description: Why this rollback is needed. Recorded on the deployment.
        required: true
        type: string

# Never overlaps a deploy: both use the production environment's Worker.
concurrency:
  group: CI/CD-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Inputs are passed through the environment so their text is never run as shell.
      - name: Roll back
        working-directory: worker
        env:
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_ID" ]; then
            npx wrangler rollback "$VERSION_ID" --message "$REASON" --yes
          else
            npx wrangler rollback --message "$REASON" --yes
          fi

      - name: Show current deployment
        working-directory: worker
        run: npx wrangler deployments status
