# CI/CD Workflow: Full validation on Pull Requests, and smart change-detected
# deployments on pushes to main (only modified components are built and deployed).
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Run one workflow per branch/ref. New commits on a pull request cancel older checks.
# A push to main never cancels an active deploy, ensuring release jobs finish safely.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only repository and pull-request access by default; specific jobs request write permissions when needed.
permissions:
  contents: read
  pull-requests: read

env:
  # Cloudflare Pages project name (keep in sync with SITE_URL in src/site.config.ts).
  PAGES_PROJECT: sourabh
  TERRAFORM_VERSION: 1.15.9
  # Disable anonymous usage metrics in automated CI environments for faster, private runs.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Change Detection
  # Analyzes git diff to determine which components were modified in this push.
  # Enables selective deployment so only changed components deploy to Cloudflare.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      site: ${{ steps.filter.outputs.site == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'worker/**'
              - 'terraform/**'
              - 'shared/**'
              - 'src/content/**'
              - 'src/data/site.ts'
              - 'src/site.config.ts'
            site:
              - 'src/**'
              - 'public/**'
              - 'astro.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'shared/**'
              - 'scripts/**'

  # ---------------------------------------------------------------------------
  # Job 2: Quality Gate & Verification
  # Runs on all pull requests and when code affecting the site or worker changes.
  # Requires no cloud secrets. Fails fast if formatting, types, or tests fail.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict package installation matching package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck site
        run: npm run check

      # Generates knowledge base types and typechecks the Worker TypeScript code.
      - name: Typecheck Worker
        run: npm run typecheck:worker

      # Runs unit tests for frontend utilities and worker functions via Vitest.
      - name: Unit tests
        run: npm test

      # Executes the Worker inside a simulated Cloudflare Workers runtime against local stubs.
      - name: Worker runtime check
        run: npm run test:runtime -w worker

      # Verifies that the Astro static site compiles cleanly without chat credentials.
      - name: Build site
        run: npm run build

      # Installs Terraform CLI. Disables wrapper script to prevent output interception.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      # Validates Terraform syntax and configuration without connecting to remote state.
      - name: Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  # ---------------------------------------------------------------------------
  # Job 3: Deploy Infrastructure & Munshi Backend
  # Runs when code affecting the backend or site is modified. If only the site
  # changed, it reads Terraform outputs but skips deploying a new Worker version.
  # ---------------------------------------------------------------------------
  backend:
    name: Deploy Munshi
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.site == 'true')
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    outputs:
      # Exported to the subsequent site job to wire the chatbot into the frontend build.
      worker_url: ${{ steps.outputs.outputs.worker_url }}
      turnstile_site_key: ${{ steps.outputs.outputs.turnstile_site_key }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Supplies Cloudflare Account ID to Terraform's var.cloudflare_account_id.
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Silences interactive CLI prompts and command suggestions in CI runner logs.
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Connects to Cloudflare R2 bucket holding Terraform remote state via S3 API.
      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Set the TF_STATE_BUCKET repository variable to the name of the R2 state bucket."
            exit 1
          fi
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"

      # Applies changes to provision the Worker and Turnstile widget in Cloudflare.
      - name: Terraform plan and apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform -chdir=terraform plan -input=false -lock-timeout=120s -out=munshi.tfplan
          terraform -chdir=terraform apply -input=false -lock-timeout=120s munshi.tfplan

      # Reads public outputs from Terraform state to pass to the frontend build job.
      - name: Read Terraform outputs
        id: outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          worker_url="$(terraform -chdir=terraform output -raw worker_url)"
          case "$worker_url" in
            http*) ;;
            *) worker_url="https://${worker_url}" ;;
          esac
          echo "worker_url=${worker_url%/}" >> "$GITHUB_OUTPUT"
          echo "turnstile_site_key=$(terraform -chdir=terraform output -raw turnstile_site_key)" >> "$GITHUB_OUTPUT"

      # Deploys Worker code and binds secrets using Wrangler ONLY if backend files changed.
      - name: Deploy Worker
        if: needs.changes.outputs.backend == 'true'
        working-directory: worker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          MUNSHI_SESSION_KEY: ${{ secrets.MUNSHI_SESSION_KEY }}
        run: |
          set -euo pipefail

          # Retrieve Turnstile secret key generated by Terraform and mask it in runner logs.
          TURNSTILE_SECRET_KEY="$(terraform -chdir=../terraform output -raw turnstile_secret_key)"
          echo "::add-mask::${TURNSTILE_SECRET_KEY}"
          export TURNSTILE_SECRET_KEY

          # Ensure all required secrets are populated before deploying.
          for name in DEEPINFRA_API_KEY MUNSHI_SESSION_KEY TURNSTILE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty. Add it as a repository secret before deploying."
              exit 1
            fi
          done

          # Write secrets to a restricted temporary file for Wrangler deploy, removed on exit.
          secrets_file="${RUNNER_TEMP}/munshi-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          umask 077
          node -e '
            const names = ["DEEPINFRA_API_KEY", "MUNSHI_SESSION_KEY", "TURNSTILE_SECRET_KEY"];
            const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]));
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(secrets));
          ' "$secrets_file"

          npx wrangler deploy --secrets-file "$secrets_file" --message "Deploy ${GITHUB_SHA}"

      # Verifies the live Worker answers health checks, CORS headers, and auth before site build.
      - name: Smoke test Worker
        if: needs.changes.outputs.backend == 'true'
        env:
          WORKER_URL: ${{ steps.outputs.outputs.worker_url }}
        run: node worker/scripts/smoke.mjs "$WORKER_URL" "https://${PAGES_PROJECT}.pages.dev"

  # ---------------------------------------------------------------------------
  # Job 4: Build & Deploy Static Site to Cloudflare Pages
  # Runs ONLY if frontend code, assets, or content were modified.
  # ---------------------------------------------------------------------------
  site:
    name: Deploy site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.site == 'true'
    needs: [changes, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://sourabh.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles the Astro static site with live backend endpoints and verifies chat root element.
      - name: Build site
        env:
          PUBLIC_MUNSHI_API_URL: ${{ needs.backend.outputs.worker_url }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ needs.backend.outputs.turnstile_site_key }}
        run: |
          npm run build
          # Safety check: ensure chat widget wasn't silently dropped due to invalid inputs.
          if ! grep -q 'data-munshi-root' dist/index.html; then
            echo "::error::The built page has no chat. Check the worker_url and turnstile_site_key outputs."
            exit 1
          fi

      # Deploys static dist/ bundle to Cloudflare Pages edge network.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
