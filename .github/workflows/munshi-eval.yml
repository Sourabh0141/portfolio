# Munshi Model Evaluation Workflow
#
# Benchmarks candidate AI models against the test suite in worker/eval/cases.json
# using the production system prompt, compiled knowledge base, and sampling settings.
# Scores models on factual accuracy, missing-data handling, prompt-injection defense,
# off-topic refusal, and confidentiality.
#
# Run this manually before changing DEEPINFRA_MODEL in worker/wrangler.jsonc, and after
# editing worker/knowledge/facts.md or worker/src/prompt.ts.
# The resulting scorecard and recommendations are written to the GitHub Step Summary.
name: Munshi evaluation

# Manual trigger only to prevent unintended third-party API inference costs on automated pushes.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated DeepInfra model IDs. Leave empty for the default candidates.
        required: false
        type: string

# Minimal permissions following the principle of least privilege.
permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow clone: history is not required for evaluation.
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Execute evaluation suite against DeepInfra API.
      # User input is passed strictly via the environment to prevent shell injection.
      # The step builds the knowledge base, scores candidate models, writes a summary,
      # and exits with non-zero if no candidate model passes the safety criteria.
      - name: Run evaluation
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          if [ -n "$MODELS" ]; then
            npm run eval -w worker -- --models "$MODELS"
          else
            npm run eval -w worker
          fi
