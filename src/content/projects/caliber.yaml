title: Caliber
order: 1
kind: Client project · Cross-cloud social video & data platform
status: Live · Offshore Lead
featured: true
summary: >-
  A cross-cloud video analytics and content intelligence platform spanning Google Cloud and AWS
  for high-volume enterprise digital media networks. Led offshore engineering from India,
  architecting automated LLM video classification, asynchronous transcription pipelines, and an
  invisible watermarking solution using Meta's PixelSeal.
highlights:
  - >-
    Built an end-to-end platform on AWS that embeds data into images and videos using Meta's
    PixelSeal model. The pipeline handles ingestion from social platforms, and the embedded
    watermark survives compression and other modifications by hiding the payload in pixel brightness.
  - >-
    Decomposed automated tagging into modular Cloud Functions with guarded SQL MERGE write-backs that
    strictly preserve human-in-the-loop annotations.
  - >-
    Engineered an automated video transcription pipeline with an asynchronous worker pool,
    time-budgeted execution, exponential jitter backoff, and deterministic BigQuery job IDs
    for idempotent retries.
stack:
  - Amazon S3
  - AWS CDK
  - AWS Lambda
  - BigQuery
  - DynamoDB
  - FastAPI
  - Google Cloud Functions
  - Google Cloud Storage
  - Next.js
  - PixelSeal
  - PyTorch
  - Python
  - Terraform
