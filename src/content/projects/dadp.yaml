title: DADP
order: 3
kind: Predusk · Data Annotation & Delivery Platform
status: Production · Predusk Technology
summary: >-
  Real-time event streaming and computer-vision services for an annotation platform, built to
  cut the manual effort annotators spend on images and video.
highlights:
  - Replaced unstable Server-Sent Events with a RabbitMQ and MQTT event-streaming microservice
    for reliable progress tracking of long-running Celery tasks.
  - Built and deployed a GPU-accelerated FastAPI service around SAM 2.1 (Hiera Large) that turns
    bounding-box or click prompts into polygon coordinates.
  - Built an automated video-tracking service using YOLO11x detection, YOLO11x-cls appearance
    embeddings and BoT-SORT to follow objects across frames.
flow:
  - Annotation UI
  - FastAPI + Celery tasks
  - SAM 2.1 / YOLO11x + BoT-SORT
  - RabbitMQ + MQTT events
  - Live progress to the annotator
stack:
  - Python
  - FastAPI
  - Celery
  - RabbitMQ
  - MQTT
  - SAM 2.1
  - YOLO11x
  - BoT-SORT
