title: Labelfort
order: 2
kind: Commercial product · Audit-ready AI data annotation & delivery platform
status: Live · Predusk
featured: true
summary: >-
  A multi-tenant, audit-ready platform for producing high-precision ML training data across
  eight media types (images, video, audio, DICOM, 3D point clouds, and more), built for AI
  teams in regulated industries whose training data must survive an audit. Engineered the
  real-time event distribution platform, GPU-accelerated computer vision microservices, and
  automated synthetic data generation.
highlights:
  - >-
    Replaced polling and SSE with a centralized RabbitMQ topic exchange and Web-MQTT streaming
    gateway over WebSockets, delivering real-time progress for 5 event domains with token-based
    RBAC topic filtering.
  - >-
    Integrated GPU-accelerated computer vision microservices: interactive click/box polygon
    segmentation via SAM 2.1 and multi-object video tracking via YOLO11x with BoT-SORT,
    reducing manual polygon annotation time by over 70% and automating cross-frame video tracking
    at 30+ FPS.
  - >-
    Engineered the Synthetic Data Designer module from prompt-driven generation to direct
    persistence, schema validation, preview, and CSV machine-learning export.
  - >-
    Eliminated upload bottlenecks with browser-direct presigned S3/MinIO multipart uploads,
    SHA-256 duplicate detection before transfer, and resume checkpoints.
stack:
  - Amazon S3
  - BoT-SORT
  - Celery
  - FastAPI
  - MinIO
  - Next.js
  - PostgreSQL
