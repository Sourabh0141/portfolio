role: Associate Software Developer
company: Predusk Technology Pvt Ltd
location: Jaipur, India
start: '2025-11'
summary: >-
  Leading client backend and cloud engineering from India while architecting distributed systems,
  event-driven streaming, and production AI services across enterprise platforms.
groups:
  - heading: Caliber · Cross-Cloud Social Video Platform & Data Engine
    points:
      - >-
        Led offshore engineering from India across Google Cloud and AWS, integrating BigQuery
        analytics, Cloud Functions, and enterprise web applications.
      - >-
        Built an end-to-end platform on AWS that embeds data into images and videos using Meta's
        PixelSeal model, ensuring watermarks survive compression across social platforms.
      - >-
        Decomposed automated tagging into modular Cloud Functions with guarded SQL MERGE write-backs
        that strictly preserve human-in-the-loop annotations.
      - >-
        Engineered an automated video transcription pipeline with an asynchronous worker pool,
        time-budgeted execution, exponential jitter backoff, and deterministic BigQuery job IDs for
        idempotent retries.
  - heading: Labelfort · Audit-Ready AI Data Annotation Platform
    points:
      - >-
        Replaced polling and SSE with a centralized RabbitMQ topic exchange and Web-MQTT streaming
        gateway over WebSockets, delivering real-time progress for 5 event domains with token-based
        RBAC topic filtering.
      - >-
        Integrated GPU-accelerated computer vision microservices: interactive click/box polygon
        segmentation via SAM 2.1 and multi-object video tracking via YOLO11x with BoT-SORT,
        reducing manual polygon annotation time by over 70% and automating tracking at 30+ FPS.
      - >-
        Engineered the Synthetic Data Designer module from prompt-driven generation to direct
        persistence, schema validation, live preview, and CSV machine-learning export.
      - >-
        Eliminated upload bottlenecks with browser-direct presigned S3/MinIO multipart uploads,
        SHA-256 duplicate detection before transfer, and resume checkpoints.
  - heading: Digilekh · Customizable Document Intelligence & Audit Automation
    points:
      - >-
        Engineered a multi-stage Celery ingestion pipeline processing scanned and digital PDFs via
        Surya OCR 2, page-level chunking, and hybrid dense/sparse vector upserts into Qdrant.
      - >-
        Led the non-blocking async migration across three core microservices using SQLAlchemy 2
        async (asyncpg), aioboto3, and httpx, eliminating event loop starvation under high
        concurrency.
      - >-
        Integrated self-hosted GPU speech microservices using Faster-Whisper (speech-to-text) and
        Kokoro-82M (neural text-to-speech) with TTL-based memory caching for real-time voice
        interactions.
      - >-
        Implemented a centralized Redis caching layer with tenant-isolated invalidation and unified
        chunk indexing across core API, ingestion, and retrieval services.
  - heading: ArchiveLens · Historical Newspaper Segmentation & Search
    points:
      - >-
        Engineered layout analysis combining Roboflow instance segmentation with a 12-pass Shapely
        polygon refinement algorithm, handling modular and historical printing layouts.
      - >-
        Developed a Celery processing pipeline with Surya OCR 2 on vLLM, featuring an automated
        loop-defence mechanism using zlib compression ratio checks and temperature escalation to
        eliminate repetitive hallucinations on dense Devanagari text.
      - >-
        Designed an OpenSearch search index with ICU transliteration analyzers, custom Hindi stemmers,
        and faceted metadata classification via Gemma.
      - >-
        Delivered interactive Next.js reading interfaces showing polygon-clipped print clippings
        alongside transcribed text, with prefetching and keyboard navigation.
  - heading: Sankirtan · Moderated Devotional Event Platform
    points:
      - >-
        Designed and built the async FastAPI backend as sole author, with a compare-and-swap
        moderation state machine enforced by PostgreSQL CHECK constraints to keep racing requests safe.
      - >-
        Hardened the unauthenticated upload endpoint with three-stage image verification (MIME
        allow-list, format match, and full Pillow decode) running on bounded worker threads off
        the event loop.
      - >-
        Built privacy-preserving rate limiting for submissions and logins using HMAC-SHA256 keyed IP
        hashes counted from existing tables, storing no raw addresses and needing no separate counter
        store.
      - >-
        Secured admin access with Argon2 hashing and HttpOnly JWT cookies, and shipped idempotent SQL
        migrations through an advisory-locked runner alongside an HTTP-level integration test suite.
