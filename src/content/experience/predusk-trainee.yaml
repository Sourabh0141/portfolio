role: Data Analyst Trainee, AI & ML Engineering
company: Predusk Technology Pvt Ltd
location: Jaipur, India
start: '2025-01'
end: '2025-10'
summary: >-
  Engineered web automation and data extraction systems within the AI & ML engineering team,
  focusing on browser automation, non-blocking data layers, and internal productivity tooling.
groups:
  - heading: OceanMind · High-Throughput Travel Portal Automation
    points:
      - >-
        Migrated from Selenium to Playwright to architect parallel browser execution, replacing
        resource-heavy dedicated browser instances with lightweight per-cabin BrowserContexts running via
        asyncio.gather to cut memory usage by 75% and accelerate quote generation by 3x.
      - >-
        Migrated data access and object storage layers from blocking synchronous drivers to non-blocking
        asyncpg and aioboto3 connection pools, eliminating event loop starvation and delivering 3x
        higher database concurrency.
      - >-
        Built real-time execution log and progress streaming to the Next.js frontend via Server-Sent
        Events (SSE) with strict per-user log isolation and cancellation mechanics.
      - >-
        Implemented an auditable human-in-the-loop validation flow, capturing multi-step screenshots
        and compressed video evidence (FFmpeg) stored in MinIO for review.
  - heading: Internal Tooling & Workflow Automation
    points:
      - >-
        Developed PV InstaTemplate, an end-to-end Chrome extension and API service with SQLite and an
        admin dashboard used by back-office operations for template automation.
